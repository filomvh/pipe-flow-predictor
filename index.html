<!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pipe Flow Viewer</title>
    <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0b1422;color:#e7effa;font:16px system-ui,sans-serif}
    main{max-width:1320px;margin:auto;padding:24px}
    h1,h2,p{margin:0 0 12px}
    h1{font-size:clamp(1.6rem,4vw,2.5rem)}
    h2{font-size:1.12rem}
    section{background:#142235;border:1px solid #29405a;border-radius:12px;
            padding:16px;margin:14px 0}
    form,.inputs,.row,.probe,.tabs{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
    label{display:grid;gap:5px;font-size:.9rem}
    input,button{font:inherit;color:inherit;border:1px solid #476380;border-radius:6px;
                 background:#0e1b2c;padding:7px}
    input[type=number]{width:120px}
    input[type=range]{width:100%;padding:0;accent-color:#61d8ff}
    button{cursor:pointer}
    button[type=submit],button[aria-pressed=true]{background:#174962;border-color:#61d8ff}
    .range{flex:1;min-width:170px}
    #metrics,#reading{font-weight:650;color:#9de7ff}
    #error{color:#ffbfaf;margin-top:10px}
    small,.note{color:#bacbdd}
    canvas{display:block;width:100%;background:#0d1929;border-radius:8px}
    #pipe{height:clamp(230px,32vw,355px);cursor:crosshair}
    #detail{height:330px}
    .legend{display:flex;gap:12px;align-items:center;margin-top:10px;font-size:.85rem}
    #scale{height:10px;flex:1;max-width:360px;border-radius:4px}
    .probe{margin-top:12px}
    </style>
    </head>
    <body>
    <main>
    <h1>Pipe Flow Viewer</h1>
    <section>
      <form id="case">
        <label>Diameter D [m]<input id="diameter" type="number" step="any" required></label>
        <label>Length L [m]<input id="length" type="number" step="any" required></label>
        <label>Inlet speed U [m/s]<input id="speed" type="number" step="any" required></label>
        <label>Viscosity ν [m²/s]<input id="viscosity" type="number" step="any" required></label>
        <button type="submit">Apply inputs</button>
      </form>
      <p id="metrics" aria-live="polite" style="margin-top:12px"></p>
      <p id="error" role="alert" hidden></p>
    </section>
    <section>
      <h2>Longitudinal velocity slice</h2>
      <div class="row">
        <label class="range">Axial position
          <input id="position" aria-label="Axial position" type="range" min="0" step="any"></label>
        <label class="range">Time
          <input id="timeline" aria-label="Time" type="range" min="0" step="any"></label>
        <button id="play" type="button" aria-pressed="false">Play</button>
      </div>
      <div class="probe">
        <label>x [m]<input id="x" type="number" min="0" step="any"></label>
        <label>t [s]<input id="time" type="number" min="0" step="any"></label>
        <label>r [m]<input id="radius" type="number" min="0" step="any"></label>
        <output id="reading" aria-live="polite"></output>
      </div>
      <p class="note" style="margin-top:12px"><small>Click the slice to place the probe.
        Radial scale is enlarged. A dashed line marks Lₑ when it falls inside the pipe.</small></p>
      <canvas id="pipe" aria-label="Longitudinal velocity heatmap"></canvas>
      <div class="legend"><span>0</span><div id="scale"></div><span id="vmax"></span></div>
      <small id="status"></small>
    </section>
    <section>
      <div class="tabs">
        <button id="cross" type="button" aria-pressed="true">Cross-section</button>
        <button id="profile" type="button" aria-pressed="false">Radial profile</button>
      </div>
      <p id="sectionTitle" style="margin-top:12px"></p>
      <canvas id="detail" aria-label="Selected cross-section or radial profile"></canvas>
    </section>
    </main>

        diskCtx.putImageData(pixels, 0, 0);
        const diameter = Math.min(width - 24, height - 34);
        ctx.drawImage(disc, (width - diameter) / 2, (height - diameter) / 2, diameter, diameter);
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(width / 2, height / 2 - side * (r / pipe.R) * diameter / 2, 4, 0, 2 * Math.PI);
        ctx.fill();
        return;
      }

      const left = 66, top = 20, w = width - 86, h = height - 62;
      const peak = Math.max(2.1 * pipe.U, ...Array.from(radial, v => Number.isFinite(v) ? 1.05 * v : 0));
      ctx.fillStyle = "#e7effa";
      for (let i = 0; i <= 4; i++) {
        const y = top + h * (1 - i / 4);
        line(ctx, left, y, left + w, y, "#354c66");
        ctx.fillText((peak * i / 4).toFixed(4), 8, y + 4);
      }
      for (const [label, shade, dash, sample] of [
        ["ML prediction", "#62d8ff", [], i => radial[Math.abs(i)]],
        ["Fully developed reference", "#efeeef", [5, 5], i => 2 * pipe.U * (1 - (i / HALF) ** 2)]
      ]) {
        ctx.strokeStyle = shade;
        ctx.lineWidth = 2;
        ctx.setLineDash(dash);
        ctx.beginPath();
        let started = false;
        for (let i = -HALF; i <= HALF; i++) {
          const value = sample(i);
          if (!Number.isFinite(value)) { started = false; continue; }
          const px = left + w * (i + HALF) / (2 * HALF), py = top + h * (1 - value / peak);
          if (started) ctx.lineTo(px, py);
          else ctx.moveTo(px, py);
          started = true;
        }
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = shade;
        ctx.fillText(label, left + 6, height - (dash.length ? 7 : 22));
      }
      ctx.fillStyle = "#e7effa";
      ctx.fillText("uₓ [m/s]", 8, 13);
      ctx.textAlign = "center";
      ctx.fillText(`−${pipe.R.toFixed(4)} m`, left, top + h + 17);
      ctx.fillText("0", left + w / 2, top + h + 17);
      ctx.fillText(`${pipe.R.toFixed(4)} m`, left + w, top + h + 17);
    }

    function draw() {
      if (!pipe) return;
      $("position").value = x;
      $("timeline").value = t;
      $("x").value = x;
      $("time").value = t;
      $("radius").value = r;
      const ux = velocity(x, r, t);
      $("reading").textContent = Number.isFinite(ux)
        ? `Axial velocity uₓ = ${ux.toFixed(7)} m/s` : "Probe outside model coverage";
      $("status").textContent = t >= pipe.ts
        ? `Steady field at tₛ = ${pipe.ts.toFixed(1)} s.`
        : "Transient field. Gray areas are outside the model’s coverage.";
      drawPipe();
      drawSection();
    }

    function requestDraw() {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { pending = false; draw(); });
    }

    function stop() {
      clearInterval(playing);
      playing = null;
      $("play").textContent = "Play";
      $("play").setAttribute("aria-pressed", "false");
    }

    function apply() {
      const [D, L, U, nu] = ["diameter", "length", "speed", "viscosity"]
        .map(id => $(id).valueAsNumber);
      try {
        if (![D, L, U, nu].every(v => Number.isFinite(v) && v > 0)) {
          throw Error("Enter positive values for all four pipe inputs.");
        }
        const re = U * D / nu;
        const [le, ts] = cutoffs(D, L, U, nu);
        const xmin = lower[1] * D, xmax = upper[1] * D;
        const tmin = lower[3] * D / U, tmax = upper[3] * D / U;
        if (!within(re, lower[0], upper[0]) || (le <= L && !within(le, xmin, xmax)) ||
            !within(ts, tmin, tmax) || ts < 0 || le < 0) {
          throw Error("The fitted cutoffs or Reynolds number are outside the velocity checkpoint’s coverage.");
        }
        const duration = Math.ceil(Math.max(data.minTimeDisplay, 1.25 * ts) / data.timeStep) * data.timeStep;
        const hadPipe = Boolean(pipe);
        pipe = {D, L, U, nu, re, le, ts, R: D / 2, xmin, xmax, tmin, tmax, duration};
        stop();
        fieldTime = null;
        x = clamp(hadPipe ? x : data.start[0], 0, L);
        t = clamp(hadPipe ? t : data.start[1], 0, duration);
        r = clamp(hadPipe ? r : data.start[2], 0, pipe.R);
        $("position").max = $("x").max = L;
        $("timeline").max = $("time").max = duration;
        $("radius").max = pipe.R;
        $("metrics").textContent =
          `Active case: D ${D} m · L ${L} m · U ${U} m/s · ν ${nu} m²/s · ` +
          `Re ${re.toFixed(0)} · Lₑ ${le.toFixed(3)} m · tₛ ${ts.toFixed(1)} s`;
        $("vmax").textContent = `${(2 * U).toPrecision(3)} m/s`;
        $("error").hidden = true;
        requestDraw();
      } catch (error) {
        $("error").textContent = error.message + (pipe ? " Showing the last valid case." : "");
        $("error").hidden = false;
      }
    }

    function bindValue(id, event, getMax, update) {
      $(id).addEventListener(event, () => {
        if (!pipe) return;
        const value = $(id).valueAsNumber;
        if (Number.isFinite(value)) update(clamp(value, 0, getMax()));
        requestDraw();
      });
    }

    function start() {
      data.testInputs.forEach((input, i) => {
        const value = predict(...input);
        if (!Number.isFinite(value) || Math.abs(value - data.testOutputs[i]) > 3e-5) {
          throw Error("Browser velocity model did not match the exported PyTorch checks.");
        }
      });
      if (cutoffs(...data.initial).some((v, i) => Math.abs(v - data.expectedCutoffs[i]) > 1e-6)) {
        throw Error("Browser cutoff fit did not match the notebook check.");
      }
      ["diameter", "length", "speed", "viscosity"].forEach((id, i) => $(id).value = data.initial[i]);
      $("scale").style.background = `linear-gradient(to right,${palette.filter((_, i) => i % 15 === 0)
        .map(rgb => `rgb(${rgb.join(",")})`).join(",")})`;
      $("case").addEventListener("submit", event => { event.preventDefault(); apply(); });
      bindValue("position", "input", () => pipe.L, value => x = value);
      bindValue("timeline", "input", () => pipe.duration, value => t = value);
      bindValue("x", "change", () => pipe.L, value => x = value);
      bindValue("time", "change", () => pipe.duration, value => t = value);
      bindValue("radius", "change", () => pipe.R, value => r = value);
      $("pipe").addEventListener("click", event => {
        if (!pipeBox) return;
        const rect = $("pipe").getBoundingClientRect();
        const {left, top, w, h} = pipeBox;
        const fx = (event.clientX - rect.left - left) / w;
        const fy = (event.clientY - rect.top - top) / h;
        if (fx < 0 || fx > 1 || fy < 0 || fy > 1) return;
        x = Number((pipe.L * fx).toFixed(4));
        side = fy <= 0.5 ? 1 : -1;
        r = clamp(Number((pipe.R * Math.abs(1 - 2 * fy)).toFixed(6)), 0, pipe.R);
        requestDraw();
      });
      $("play").addEventListener("click", () => {
        if (!pipe) return;
        if (playing !== null) { stop(); return; }
        if (t >= pipe.duration) t = 0;
        $("play").textContent = "Pause";
        $("play").setAttribute("aria-pressed", "true");
        playing = setInterval(() => {
          t = Math.min(t + data.timeStep, pipe.duration);
          requestDraw();
          if (t >= pipe.duration) stop();
        }, data.playInterval);
      });
      for (const tab of ["cross", "profile"]) {
        $(tab).addEventListener("click", () => {
          activeTab = tab;
          $("cross").setAttribute("aria-pressed", String(tab === "cross"));
          $("profile").setAttribute("aria-pressed", String(tab === "profile"));
          requestDraw();
        });
      }
      window.addEventListener("resize", requestDraw);
      apply();
    }

    try {
      start();
    } catch (error) {
      $("error").textContent = error.message;
      $("error").hidden = false;
    }
    </script>
    </body>
    </html>
